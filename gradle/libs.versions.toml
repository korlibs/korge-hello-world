[versions]
korge = "7.0.0-SNAPSHOT"

# To check the version number of the latest Kotlin release, go to
# https://kotlinlang.org/docs/releases.html
kotlin = "2.3.21"

# Android target related
android-gradle-plugin = "9.2.1"
compileSdk = "36"
minSdk = "36"
material = "1.10.0"

# Versions of additions
kotlinx-serialization = "1.11.0"
kaml = "0.61.0"
fleks = "2.14"
kotlinStdlib = "2.3.21"
kotlinTest = "2.3.21"
runner = "1.5.2"
core = "1.5.0"
junit = "1.3.0"


[plugins]
korge = { id = "org.korge.engine", version.ref = "korge" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }

# Additional plugins
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-lint = { id = "com.android.lint", version.ref = "android-gradle-plugin" }


[libraries]
korge = { module = "org.korge.engine:korge", version.ref = "korge" }

# Android target related
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Additional libs
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
fleks = { module = "io.github.quillraven.fleks:Fleks", version.ref = "fleks"}
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }
runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
core = { group = "androidx.test", name = "core", version.ref = "core" }
junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
